name: Native iOS Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - shortcuts-chatgpt-test
    paths:
      - "ios/**"
      - "jarvisicon.png"
      - ".github/workflows/ios-native-build.yml"

jobs:
  build-unsigned-ipa:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Generate app icon from repository image
        run: |
          set -euo pipefail
          test -f jarvisicon.png
          ICONSET="ios/JARVISReader/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          cat > ios/JARVISReader/Assets.xcassets/Contents.json <<'EOF'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          cat > "$ICONSET/Contents.json" <<'EOF'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          sips -z 1024 1024 jarvisicon.png --out "$ICONSET/AppIcon-1024.png"
          sips -g pixelWidth -g pixelHeight "$ICONSET/AppIcon-1024.png"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild \
            -project JARVISReader.xcodeproj \
            -scheme JARVISReader \
            -resolvePackageDependencies

      - name: Build unsigned iPhone test app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project JARVISReader.xcodeproj \
            -scheme JARVISReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/JARVISDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned test IPA
        run: |
          APP="$RUNNER_TEMP/JARVISDerivedData/Build/Products/Release-iphoneos/JARVISReader.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry JARVISReader-Test-unsigned.ipa Payload

      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: JARVISReader-Test-unsigned-ipa
          path: ${{ runner.temp }}/JARVISReader-Test-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
