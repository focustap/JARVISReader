# Experimental Shortcuts/ChatGPT test app. Stable native-ios remains untouched.
name: JARVISReader
options:
  bundleIdPrefix: com.focustap
  deploymentTarget:
    iOS: "17.2"
packages:
  MetaWearables:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.9.0
targets:
  JARVISReader:
    type: application
    platform: iOS
    sources:
      - path: JARVISReader
    info:
      path: JARVISReader/Info.plist
      properties:
        CFBundleDisplayName: JARVIS Reader Test
        CFBundleShortVersionString: "1.0.21"
        CFBundleVersion: "21"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - jarvisreader-test
        LSApplicationQueriesSchemes:
          - fb-viewapp
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
        UIBackgroundModes:
          - processing
          - bluetooth-central
          - bluetooth-peripheral
          - external-accessory
        NSBluetoothAlwaysUsageDescription: JARVIS Reader Test connects to your Meta glasses to capture images and show answers.
        NSBluetoothPeripheralUsageDescription: JARVIS Reader Test uses Bluetooth to communicate with your Meta glasses.
        NSLocalNetworkUsageDescription: JARVIS Reader Test uses the local network to communicate with your Meta glasses.
        NSBonjourServices:
          - _bonjour._tcp
        MWDAT:
          DAMEnabled: true
          AppLinkURLScheme: jarvisreader-test://
          MetaAppID: "0"
          ClientToken: ""
          TeamID: CX3DNSA9YG
          Analytics:
            OptOut: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focustap.JARVISReaderTest
        PRODUCT_NAME: JARVISReader
        MARKETING_VERSION: "1.0.21"
        CURRENT_PROJECT_VERSION: "21"
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: MetaWearables
        product: MWDATCore
      - package: MetaWearables
        product: MWDATCamera
      - package: MetaWearables
        product: MWDATDisplay
